# Pollution Hunter constants. Every value names its source (PLAN.md section), so there are no
# magic numbers in code.
method_version: ph-emg-1.0

extract:
  # PLAN.md 4.3 step 2: a 0.03 degree grid covering 180 km in every direction.
  grid_step_deg: 0.03
  half_extent_km: 180
  # PLAN.md 4.3 step 2: the server-side filter that runs before anything is downloaded.
  valid_radius_km: 50
  min_valid_frac: 0.5
  max_solar_zenith_deg: 65
  max_sensor_zenith_deg: 56
  # Native cell of the L3 collection, 0.01 degree. Used as the scale of the server-side stats.
  reduce_scale_m: 1113.2

quota:
  # PLAN.md 1.5: Earth Engine Community tier, EECU-hours per month.
  community_eecu_hours: 150

wind:
  # PLAN.md 4.3 step 3 and section 2 (data sources): ERA5 hourly, 100 m wind, about 28 km grid.
  collection: ECMWF/ERA5/HOURLY
  u_band: u_component_of_wind_100m
  v_band: v_component_of_wind_100m
  # Native ERA5 cell, 0.25 degree.
  scale_m: 27830
  # Hours sampled per server call.
  batch_hours: 100
  # PLAN.md 4.3 step 3: the satellite passes at about 13:30 local solar time. Used only when
  # the sun based pass time does not fall inside the image window.
  fallback_solar_hour: 13.5
  # The sun formulas are good to about a minute. Allow ten for the window edge check.
  window_tolerance_min: 10
  # PLAN.md 4.3 step 3: in calmer air the gas pools and has no direction.
  min_speed_ms: 2.0

observe:
  # PLAN.md Appendix A, the outline of how observe.py uses core_math.py, and its tests.
  crosswind_km: {start: -80.0, stop: 80.0, step: 2.0}
  travel_hours: {start: -2.0, stop: 6.0, step: 0.1}
  # PLAN.md 4.6 and Appendix A: NOx as a multiple of NO2, and the air mass factor correction.
  nox_to_no2: 1.38
  amf_correction: 1.61
  # PLAN.md 4.3 step 8: bootstrap over days.
  n_boot: 200
  seed: 0
  # PLAN.md 4.5 and Appendix A failed_gates(): the minimum number of days.
  min_days: 40
