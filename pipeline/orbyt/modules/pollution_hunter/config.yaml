# Pollution Hunter constants. Every value names its source (PLAN.md section), so there are no
# magic numbers in code.
method_version: ph-emg-1.1

extract:
  # PLAN.md 4.3 step 2: a 0.03 degree grid covering 180 km in every direction.
  grid_step_deg: 0.03
  half_extent_km: 180
  # PLAN.md 4.3 step 2: the server-side filter that runs before anything is downloaded.
  valid_radius_km: 50
  min_valid_frac: 0.5
  max_solar_zenith_deg: 65
  max_sensor_zenith_deg: 56
  # Native cell of the L3 collection, 0.01 degree. Used as the scale of the server-side stats.
  reduce_scale_m: 1113.2

quota:
  # PLAN.md 1.5: Earth Engine Community tier, EECU-hours per month.
  community_eecu_hours: 150

wind:
  # PLAN.md 4.3 step 3 and section 2 (data sources): ERA5 hourly, 100 m wind, about 28 km grid.
  collection: ECMWF/ERA5/HOURLY
  u_band: u_component_of_wind_100m
  v_band: v_component_of_wind_100m
  # Native ERA5 cell, 0.25 degree.
  scale_m: 27830
  # Hours sampled per server call.
  batch_hours: 100
  # PLAN.md 4.3 step 3: the satellite passes at about 13:30 local solar time. Used only when
  # the sun based pass time does not fall inside the image window.
  fallback_solar_hour: 13.5
  # The sun formulas are good to about a minute. Allow ten for the window edge check.
  window_tolerance_min: 10
  # PLAN.md 4.3 step 3: in calmer air the gas pools and has no direction.
  min_speed_ms: 2.0

observe:
  # PLAN.md Appendix A, the outline of how observe.py uses core_math.py, and its tests.
  crosswind_km: {start: -80.0, stop: 80.0, step: 2.0}
  travel_hours: {start: -2.0, stop: 6.0, step: 0.1}
  # Daily background: a plane fitted to the upwind box (PLAN.md 4.3 step 4, 20 to 70 km upwind)
  # and to both flanks, the outer quarter of the crosswind grid. Added in M3.5 after a single
  # upwind median left regional gradients in the stack (docs/decisions.md). Not tuned to any
  # register value. 50 and 70 km move the Belchatow estimate by 4 and 9 percent. Final value
  # comes from the US validation (PLAN.md 4.9, V4).
  upwind_box_km: [-70.0, -20.0]
  flank_km: 60.0
  # Diagnostic only: a wind quarter needs this many days before its own curve is drawn.
  sector_min_days: 10
  # PLAN.md 4.6 and Appendix A: NOx as a multiple of NO2, and the air mass factor correction.
  nox_to_no2: 1.38
  amf_correction: 1.61
  # PLAN.md 4.3 step 8: bootstrap over days.
  n_boot: 200
  seed: 0
  # PLAN.md 4.5 and Appendix A failed_gates(): the minimum number of days.
  min_days: 40

candidates:
  # PLAN.md 1.5 and 4.5: below this the satellite cannot see a source. Footprint total.
  min_footprint_t: 2000
  # PLAN.md 4.5, footprint accounting: facilities within this distance are one subject.
  footprint_km: 20
  # PLAN.md 4.5, isolation: no other register source above a quarter of this one, 20 to 60 km.
  source_min_km: 20
  source_max_km: 60
  source_frac: 0.25
  # PLAN.md 4.5, isolation: no city above 200,000 people within 30 km.
  city_near_km: 30
  city_near_pop: 200000
  # Added after the M3.5 review of Belchatow (docs/decisions.md): the plume is followed for up to
  # 6 h, about 100 km at 5 m/s, so a big city that far out reaches the fan. 500,000 is
  # provisional: more than twice the near rule because a city matters less at three times the
  # distance. The hotspot test below is the data-driven check, and the V3 null test (PLAN.md
  # 4.9) is what finally sets this.
  city_far_km: 100
  city_far_pop: 500000
  hotspot:
    # Annual mean NO2 map (0.1 degree, 2024). Crop of this half-width around each facility.
    window_km: 200
    # Background is the median in this ring, outside the plume reach.
    background_km: [130, 200]
    # Own enhancement is the highest cell within this distance. One 0.1 degree cell is 7 to 11 km.
    own_km: 12
    # Other hotspots: a local maximum of this many cells square, inside this ring.
    peak_cells: 5
    min_km: 20
    max_km: 100
    # A peak counts as a hotspot only if it also stands this many robust standard deviations
    # (1.4826 x MAD of the background ring) above the background. The same floor says whether the
    # facility's own enhancement is visible at all. 3 is the usual cut.
    noise_sigmas: 3
    # Same quarter as the source rule: another hotspot at a quarter of our own enhancement or more.
    frac: 0.25

validation:
  # M4.2, choosing the US plants (PLAN.md 4.9 V1 and V2). Chosen from the monitors alone, before
  # any satellite estimate exists for them, so the choice cannot be tuned to the result.
  # The two calendar years compared with the satellite (PLAN.md section 0).
  years: [2023, 2024]
  # PLAN.md 1.5: below this the satellite cannot see a source. Needed in each year.
  min_footprint_t: 2000
  # Ground truth quality, not in the plan: the share of the monitored tonnes whose measurement
  # code is Measured (the rest is calculated from fuel use or substituted), and the largest share
  # of operating unit hours with no NOx value. 0.9 and 0.01 are round numbers set before looking
  # at the list, and the funnel in docs/decisions.md shows what each one removes.
  min_measured_share: 0.9
  max_operating_gap: 0.01
  # PLAN.md 4.9 V1: 30 to 40 isolated plants. Only 13 US footprints pass every isolation check,
  # so there are two tiers. Tier 1 passes all four checks, the population the site publishes.
  # Tier 2 may also fail the two checks that were added after the M3.5 review (city_far, whose
  # 500,000 the plan marks as provisional, and the hotspot check), but must still pass sources
  # and city_near, the two checks of PLAN.md 4.5 as first written. M4.3 reports the tiers
  # separately. Fixed from the rules alone, before any US estimate exists.
  tier2_may_fail: [city_far, hotspot]

detect:
  # Single-day plume test, PLAN.md 4.4. Wind-aligned grid in km, wide enough for the mirrored
  # upwind box (minus box_max_km) and the part of the plume the flipbook shows.
  x_km: {start: -60.0, stop: 100.0, step: 2.0}
  # Downwind box length is the distance travelled in this many hours, capped at box_max_km.
  box_hours: 2.0
  box_max_km: 60.0
  # Both boxes need at least this share of valid cells, otherwise the day is not tested.
  min_valid_frac: 0.6
  # Detected when z = (down - up) / noise reaches this.
  z_min: 3.0
  # Real TROPOMI pixel area, used to count independent pixels (PLAN.md 4.4). The download grid is finer.
  pixel_area_km2: 19.0
  flipbook:
    # A day is a frame when this share of the shown image is valid.
    min_valid_frac: 0.8
    show_from_km: -20.0
    # Colour ramp runs from 0 to this enhancement, the facility view range of PLAN.md 9.2.
    full_scale_umol_m2: 100.0
    scale_px: 3
    label_px: 46
    columns: 10

evidence:
  # Images for the panel (M3.7, PLAN.md 9.6). Colours are the plume ramp of PLAN.md 9.2 with its
  # opacity, laid over the night ocean colour, so clean air is dark and the plume glows.
  stack:
    # Full scale of the wind-aligned plume image in micromol/m2: the smallest of these steps that
    # holds this percentile of the cells, the usual display stretch. The few cells above it, at
    # the source, take the top colour. A mean over a year of days is far weaker than one day, so
    # it does not share the 0 to 100 range of the daily frames. The panel prints the range.
    full_scale_steps_umol_m2: [5, 10, 20, 50, 100, 200]
    full_scale_percentile: 99
    # A cell is drawn when this share of the days saw it, the same rule as stack_profile.
    min_days_frac: 0.3
    width_px: 640
    webp_quality: 95
  flipbook:
    # One north-up frame per clear day: a square of this half-width around the source, on the
    # 2 km grid the estimate uses.
    half_km: 80.0
    step_km: 2.0
    # A day is a frame when this share of the square is valid, as in detect.flipbook.
    min_valid_frac: 0.8
    # Facility view range of PLAN.md 9.2: enhancement above background from 0 to 100.
    full_scale_umol_m2: 100.0
    # Each 2 km cell is drawn this many pixels wide (bicubic), the browser scales the rest.
    upscale: 2
    webp_quality: 82
  # The facility the site flies to when a visitor presses "Explore the globe" (PLAN.md 9.7,
  # the first story facility). Atherinolakkos: the largest reporter that passes the isolation
  # rule and every gate (docs/decisions.md).
  showcase_subject_id: ph-eu-12a5336d
