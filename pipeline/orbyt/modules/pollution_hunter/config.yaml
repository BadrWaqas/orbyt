# Pollution Hunter constants. Every value names its source (PLAN.md section), so there are no
# magic numbers in code.
method_version: ph-emg-1.1

extract:
  # PLAN.md 4.3 step 2: a 0.03 degree grid covering 180 km in every direction.
  grid_step_deg: 0.03
  half_extent_km: 180
  # PLAN.md 4.3 step 2: the server-side filter that runs before anything is downloaded.
  valid_radius_km: 50
  min_valid_frac: 0.5
  max_solar_zenith_deg: 65
  max_sensor_zenith_deg: 56
  # Native cell of the L3 collection, 0.01 degree. Used as the scale of the server-side stats.
  reduce_scale_m: 1113.2

quota:
  # PLAN.md 1.5: Earth Engine Community tier, EECU-hours per month.
  community_eecu_hours: 150

wind:
  # PLAN.md 4.3 step 3 and section 2 (data sources): ERA5 hourly, 100 m wind, about 28 km grid.
  collection: ECMWF/ERA5/HOURLY
  u_band: u_component_of_wind_100m
  v_band: v_component_of_wind_100m
  # Native ERA5 cell, 0.25 degree.
  scale_m: 27830
  # Hours sampled per server call.
  batch_hours: 100
  # PLAN.md 4.3 step 3: the satellite passes at about 13:30 local solar time. Used only when
  # the sun based pass time does not fall inside the image window.
  fallback_solar_hour: 13.5
  # The sun formulas are good to about a minute. Allow ten for the window edge check.
  window_tolerance_min: 10
  # PLAN.md 4.3 step 3: in calmer air the gas pools and has no direction.
  min_speed_ms: 2.0

observe:
  # PLAN.md Appendix A, the outline of how observe.py uses core_math.py, and its tests.
  crosswind_km: {start: -80.0, stop: 80.0, step: 2.0}
  travel_hours: {start: -2.0, stop: 6.0, step: 0.1}
  # Daily background: a plane fitted to the upwind box (PLAN.md 4.3 step 4, 20 to 70 km upwind)
  # and to both flanks, the outer quarter of the crosswind grid. Added in M3.5 after a single
  # upwind median left regional gradients in the stack (docs/decisions.md). Not tuned to any
  # register value. 50 and 70 km move the Belchatow estimate by 4 and 9 percent. Final value
  # comes from the US validation (PLAN.md 4.9, V4).
  upwind_box_km: [-70.0, -20.0]
  flank_km: 60.0
  # Diagnostic only: a wind quarter needs this many days before its own curve is drawn.
  sector_min_days: 10
  # PLAN.md 4.6 and Appendix A: NOx as a multiple of NO2, and the air mass factor correction.
  nox_to_no2: 1.38
  amf_correction: 1.61
  # PLAN.md 4.3 step 8: bootstrap over days.
  n_boot: 200
  seed: 0
  # PLAN.md 4.5 and Appendix A failed_gates(): the minimum number of days.
  min_days: 40

candidates:
  # PLAN.md 1.5 and 4.5: below this the satellite cannot see a source. Footprint total.
  min_footprint_t: 2000
  # PLAN.md 4.5, footprint accounting: facilities within this distance are one subject.
  footprint_km: 20
  # PLAN.md 4.5, isolation: no other register source above a quarter of this one, 20 to 60 km.
  source_min_km: 20
  source_max_km: 60
  source_frac: 0.25
  # PLAN.md 4.5, isolation: no city above 200,000 people within 30 km.
  city_near_km: 30
  city_near_pop: 200000
  # Added after the M3.5 review of Belchatow (docs/decisions.md): the plume is followed for up to
  # 6 h, about 100 km at 5 m/s, so a big city that far out reaches the fan. 500,000 is
  # provisional: more than twice the near rule because a city matters less at three times the
  # distance. The hotspot test below is the data-driven check, and the V3 null test (PLAN.md
  # 4.9) is what finally sets this.
  city_far_km: 100
  city_far_pop: 500000
  hotspot:
    # Annual mean NO2 map (0.1 degree, 2024). Crop of this half-width around each facility.
    window_km: 200
    # Background is the median in this ring, outside the plume reach.
    background_km: [130, 200]
    # Own enhancement is the highest cell within this distance. One 0.1 degree cell is 7 to 11 km.
    own_km: 12
    # Other hotspots: a local maximum of this many cells square, inside this ring.
    peak_cells: 5
    min_km: 20
    max_km: 100
    # A peak counts as a hotspot only if it also stands this many robust standard deviations
    # (1.4826 x MAD of the background ring) above the background. The same floor says whether the
    # facility's own enhancement is visible at all. 3 is the usual cut.
    noise_sigmas: 3
    # Same quarter as the source rule: another hotspot at a quarter of our own enhancement or more.
    frac: 0.25
