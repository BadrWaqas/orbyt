[project]
name = "orbyt"
version = "0.0.1"
description = "Orbyt Earth pipeline: satellite observations compared with official reports"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "duckdb>=2.0.0",
    "earthengine-api>=1.7.52",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyshp>=3.1.8",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbyt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# PLAN.md Appendix A, copied as written. plume() is defined inside the day loop and called in
# the same iteration, so the loop variables it uses are always the current ones.
"tests/test_core_math.py" = ["B023"]
