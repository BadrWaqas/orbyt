[project]
name = "orbyt"
version = "0.0.1"
description = "Orbyt Earth pipeline: satellite observations compared with official reports"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "earthengine-api>=1.7.52",
    "numpy>=2.5.4",
    "rasterio>=1.5.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbyt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
